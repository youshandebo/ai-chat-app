  <script>
    // Immediately apply dark mode before page renders to prevent flash
    (function () {
      try {
        var stored = JSON.parse(localStorage.getItem('ai-chat-storage') || '{}');
        var theme = stored?.state?.settings?.theme;
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (theme === 'auto' && prefersDark) || (!theme && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { }
    })();
  </script>
  <style>
    /* Loading screen respects dark mode */
    .loading-container {
      text-align: center;
      margin-top: 20vh;
      transition: opacity 0.3s;
    }

    .loading-container h1 {
      color: #1a1a1a;
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    .loading-container p {
      color: #666;
    }

    .dark .loading-container h1 {
      color: #fff;
    }

    .dark .loading-container p {
      color: #aaa;
    }

    html.dark {
      background-color: #1a1a1a;
    }
