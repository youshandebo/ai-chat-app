<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 800px; margin: 0 auto; }
        button { padding: 10px 20px; margin: 10px 0; cursor: pointer; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Admin API Test Page</h1>
    <p>This page directly calls the API to verify it's working, bypassing any cache issues.</p>
    
    <button onclick="testMetrics()">Test Metrics API</button>
    <button onclick="testArticles()">Test Articles API</button>
    <button onclick="clearStorage()">Clear LocalStorage</button>
    
    <div id="output"></div>

    <script>
        const TOKEN = 'fnx081013fnx';
        const output = document.getElementById('output');

        function log(msg, isError = false) {
            const div = document.createElement('div');
            div.className = isError ? 'error' : 'success';
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${msg}`;
            output.appendChild(div);
        }

        async function testMetrics() {
            output.innerHTML = '<h3>Testing Metrics API...</h3>';
            
            const ranges = ['24h', '7d', '30d', '365d'];
            for (const range of ranges) {
                try {
                    const response = await fetch(`/api/admin/metrics?range=${range}`, {
                        headers: {
                            'Authorization': `Bearer ${TOKEN}`
                        }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        log(`✅ GET /api/admin/metrics?range=${range} : ${response.status} OK`);
                        const pre = document.createElement('pre');
                        pre.textContent = JSON.stringify(data, null, 2).substring(0, 300) + '...';
                        output.appendChild(pre);
                    } else {
                        const text = await response.text();
                        log(`❌ GET /api/admin/metrics?range=${range} : ${response.status} ${response.statusText}`, true);
                        log(`Response: ${text}`, true);
                    }
                } catch (error) {
                    log(`❌ Error calling metrics API: ${error.message}`, true);
                }
            }
        }

        async function testArticles() {
            output.innerHTML = '<h3>Testing Articles API...</h3>';
            
            try {
                const response = await fetch('/api/admin/articles', {
                    headers: {
                        'Authorization': `Bearer ${TOKEN}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✅ GET /api/admin/articles : ${response.status} OK`);
                    const pre = document.createElement('pre');
                    pre.textContent = JSON.stringify(data, null, 2);
                    output.appendChild(pre);
                } else {
                    const text = await response.text();
                    log(`❌ GET /api/admin/articles : ${response.status} ${response.statusText}`, true);
                    log(`Response: ${text}`, true);
                }
            } catch (error) {
                log(`❌ Error calling articles API: ${error.message}`, true);
            }
        }

        function clearStorage() {
            localStorage.clear();
            sessionStorage.clear();
            log('✅ LocalStorage and SessionStorage cleared');
            log('Please refresh the admin page now');
        }

        // Auto-test on load
        window.addEventListener('load', () => {
            log('Page loaded. Click buttons to test APIs.');
        });
    </script>
</body>
</html>
